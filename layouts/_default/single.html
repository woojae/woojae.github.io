{{ define "main" }}
  <article class="window reader">
    <div class="window-titlebar">
      <a class="window-close" href="{{ with .Parent }}{{ .RelPermalink }}{{ else }}/{{ end }}" aria-label="Close"></a>
      <h1 class="window-title">{{ .Title }}</h1>
      <div class="window-actions">
        <button type="button" data-action="print" aria-label="Print">{{ partial "icon.html" "print" }}</button>
      </div>
    </div>
    <div class="window-body">
      <header>
        <div class="reader-title">{{ .Title }}</div>
        <div class="reader-meta">{{ .Date.Format "January 2, 2006" }} · {{ .Site.Title }}</div>
      </header>
      <div class="reader-content">
        {{ .Content }}
      </div>
    </div>
  </article>
{{ end }}
