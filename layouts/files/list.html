{{ define "main" }}
  <section class="window">
    <div class="window-titlebar">
      <a class="window-close" href="/" aria-label="Close"></a>
      <h1 class="window-title">Files</h1>
    </div>
    <div class="window-body">
      <div class="icon-grid">
        <a class="file-icon" href="/posts/">
          {{ partial "icon.html" "folder" }}
          <span class="file-name">Posts</span>
        </a>
        <a class="file-icon" href="/links/">
          {{ partial "icon.html" "folder" }}
          <span class="file-name">Links</span>
        </a>
      </div>
    </div>
  </section>
{{ end }}
